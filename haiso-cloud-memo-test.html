<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAISO MAP メモ共有検証</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b4d;font:16px -apple-system,BlinkMacSystemFont,sans-serif}header{background:#102a43;color:white;padding:22px;font-size:24px;font-weight:bold}main{max-width:650px;margin:auto;padding:16px}section{background:white;border:1px solid #dce4ec;border-radius:14px;padding:18px}label{display:block;margin-top:16px;font-weight:bold}input,button{font:inherit;width:100%;padding:14px;border-radius:9px;border:1px solid #cbd5df}button{background:#102a43;color:white;font-weight:bold;margin-top:12px}button:disabled{opacity:.5}#result{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}p{line-height:1.6}small{color:#66788a}</style></head><body><header>HAISO MAP</header><main><section><h2>配達メモ共有テスト</h2><p>以前登録した架空のテスト住所1件だけが対象です。実際の配達先、端末内データ、当日リストは変更しません。新規登録・削除も行いません。</p><form id="form"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="username" required><label for="pw">パスワード</label><input id="pw" type="password" autocomplete="current-password" required><button type="submit" value="read">ログインしてメモを確認</button><button type="submit" value="edit">ログインしてテストメモを変更</button></form><p id="result" role="status">未接続</p><small>変更は固定の検証用文言に限定します。元の検証版でのメモ一致テストは変更後には一致しなくなります。</small></section></main><script>
const base='https://tciymibhdqgskaiqnihu.supabase.co',key='sb_publishable_oAXxXagTHl5E1VU-53ah-Q_oktxOJql';
const address='HAISO MAP CLOUD TEST — 架空住所';
const original='共有メモ検証用（実在の配達先ではありません）';
const changed='共有メモ編集テスト成功（架空住所・実在の配達先ではありません）';
const el=id=>document.getElementById(id),msg=el('result'),form=el('form');
async function request(path,options){const c=new AbortController();const t=setTimeout(()=>c.abort(),20000);try{return await fetch(base+path,{...options,signal:c.signal,cache:'no-store'});}finally{clearTimeout(t);}}
form.addEventListener('submit',async e=>{e.preventDefault();const edit=e.submitter?.value==='edit';if(edit&&!confirm('架空のテスト住所1件のメモを変更します。よろしいですか？'))return;const buttons=form.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);let token,attempted=false;msg.textContent='接続中…';try{const body=JSON.stringify({email:el('email').value.trim(),password:el('pw').value});el('pw').value='';const r=await request('/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body});const j=await r.json();if(!r.ok||!j.access_token||!j.user?.id)throw Error('ログイン失敗 HTTP '+r.status);token=j.access_token;const headers={apikey:key,Authorization:'Bearer '+token,'Content-Type':'application/json'};const query='/rest/v1/address_master?select=id,address,memo&address=eq.'+encodeURIComponent(address);const read=async()=>{const res=await request(query,{headers});if(!res.ok)throw Error('読み込み失敗 HTTP '+res.status);const rows=await res.json();if(rows.length!==1||rows[0].address!==address||!rows[0].id)throw Error('対象が1件に特定できないため中止（件数 '+rows.length+'）');return rows[0];};let row=await read();let result='読み込み成功';if(edit){if(row.memo===changed){result='変更済みのため更新なし';}else{if(row.memo!==original)throw Error('想定外のメモのため更新中止');attempted=true;const p=await request(query+'&id=eq.'+encodeURIComponent(row.id)+'&memo=eq.'+encodeURIComponent(original),{method:'PATCH',headers:{...headers,Prefer:'return=representation'},body:JSON.stringify({memo:changed})});if(!p.ok)throw Error('更新失敗 HTTP '+p.status);const updated=await p.json();if(updated.length!==1||updated[0].id!==row.id||updated[0].memo!==changed)throw Error('更新結果を確認できません');const after=await read();if(after.id!==row.id||after.memo!==changed)throw Error('再読み込みで一致しません');row=after;result='メモ変更・再読み込み成功';}}msg.textContent='ログイン成功\n'+result+'\n現在のテストメモ：'+row.memo+'\n端末内データは変更していません。';}catch(err){msg.textContent=(err.name==='AbortError'?'通信タイムアウト':String(err.message||err))+(attempted?'\n更新済みの可能性があります。読み込みボタンで確認してください。':'');}finally{if(token){try{const r=await request('/auth/v1/logout?scope=local',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+token}});msg.textContent+=r.ok?'\nテスト用セッション終了。':'\nセッション終了未確認。';}catch{msg.textContent+='\nセッション終了未確認。';}}el('pw').value='';buttons.forEach(b=>b.disabled=false);}});
</script></body></html>
